[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-graveyard"
version = "0.0.1"
description = "A respectful tool for digging up dead code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ram Gopal Nagaboina" }]
keywords = ["git", "history", "archaeology", "code-search"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "pygit2>=1.15",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
graveyard = "graveyard.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
